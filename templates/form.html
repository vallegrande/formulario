<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados solo para la imagen */
        .imagen {
            width: 150px; /* Ajustar el tamaño de la imagen */
            height: auto;
            margin-right: 2rem; /* Espacio a la derecha de la imagen */
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex justify-center items-center">

    <!-- Contenedor flex para mostrar imagen y formulario lado a lado -->
    <div class="flex items-center justify-center space-x-10 w-full max-w-6xl">

        <!-- Contenedor de Imagen y Contexto (a la izquierda) -->
        <div class="flex items-center justify-center flex-col bg-white p-6 rounded-lg shadow-md w-1/3">
            <img src="https://cdn-icons-png.flaticon.com/512/3200/3200751.png" alt="Imagen de contexto" class="imagen mb-4" />
            <h1 class="text-2xl font-bold text-gray-800">Bienvenido al Formulario de Registro</h1>
            <p class="mt-4 text-gray-600">Por favor, completa los siguientes campos para registrarte. Asegúrate de que toda la información esté correcta antes de enviarla.</p>
        </div>

        <!-- Formulario de Registro (a la derecha) -->
        <form action="/enviar" method="POST" class="bg-white p-8 rounded-lg shadow-md w-2/3">
            <h2 class="text-3xl font-bold mb-6 text-center">Formulario de Registro Completo</h2>

            <!-- Nombre -->
            <label class="block mb-4">
                <span class="text-gray-700">Nombre Completo</span>
                <input name="nombre" type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Ingresa tu nombre completo" />
            </label>

            <!-- Correo Electrónico -->
            <label class="block mb-4">
                <span class="text-gray-700">Correo Electrónico</span>
                <input name="correo" type="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="ejemplo@dominio.com" />
            </label>

            <!-- Teléfono -->
            <label class="block mb-4">
                <span class="text-gray-700">Teléfono</span>
                <input name="telefono" type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Número de teléfono" />
            </label>

            <!-- Dirección -->
            <label class="block mb-4">
                <span class="text-gray-700">Dirección</span>
                <input name="direccion" type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Ingresa tu dirección" />
            </label>

            <!-- Fecha de Nacimiento -->
            <label class="block mb-4">
                <span class="text-gray-700">Fecha de Nacimiento</span>
                <input name="fecha_nacimiento" type="date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
            </label>

            <!-- Género -->
            <label class="block mb-4">
                <span class="text-gray-700">Género</span>
                <select name="genero" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                </select>
            </label>

            <!-- Aceptación de Términos -->
            <label class="flex items-center mb-4">
                <input type="checkbox" name="terminos" required class="form-checkbox h-5 w-5 text-indigo-600" />
                <span class="ml-2 text-gray-700">Acepto los <a href="#" class="text-indigo-600">términos y condiciones</a></span>
            </label>

            <!-- Botón de Enviar -->
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Enviar</button>
        </form>
    </div>

</body>
</html>
