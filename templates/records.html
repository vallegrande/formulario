<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registros de Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-6 text-center">Lista de Registros</h1>

        <!-- Tabla de registros -->
        <table class="table-auto w-full border-collapse">
            <thead>
                <tr class="bg-indigo-600 text-white">
                    <th class="border px-4 py-2">ID</th>
                    <th class="border px-4 py-2">Nombre</th>
                    <th class="border px-4 py-2">Correo</th>
                    <th class="border px-4 py-2">Teléfono</th>
                    <th class="border px-4 py-2">Dirección</th>
                    <th class="border px-4 py-2">Fecha de Nacimiento</th>
                    <th class="border px-4 py-2">Género</th>
                </tr>
            </thead>
            <tbody>
                {% for registro in registros %}
                    <tr class="bg-gray-50 hover:bg-gray-100">
                        <td class="border px-4 py-2 text-center">{{ registro[0] }}</td>
                        <td class="border px-4 py-2">{{ registro[1] }}</td>
                        <td class="border px-4 py-2">{{ registro[2] }}</td>
                        <td class="border px-4 py-2">{{ registro[3] }}</td>
                        <td class="border px-4 py-2">{{ registro[4] }}</td>
                        <td class="border px-4 py-2">{{ registro[5] }}</td>
                        <td class="border px-4 py-2">{{ registro[6] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <br>
        <div class="flex justify-center">
            <a href="/" class="bg-indigo-600 text-white py-2 px-6 rounded hover:bg-indigo-700">
                Volver al Formulario
            </a>
        </div>
</body>
</html>
